# Whole shop in containers: docker compose -f docker-compose.example.yml up -d --build
# Needs ../nodejs-pro/.env (see that repo); set CORS_ORIGINS there to the site origin (e.g. http://localhost).
include:
  - ../nodejs-pro/docker-compose.yml

services:
  web:
    build:
      context: .
      args:
        API_ORIGIN: http://app:8080
    environment:
      API_ORIGIN: http://app:8080
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - app
    restart: unless-stopped
