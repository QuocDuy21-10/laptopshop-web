# Whole shop in containers: docker compose -f docker-compose.example.yml up -d --build
# Needs ../laptopshop-api/.env (see that repo); set CORS_ORIGINS there to the site origin (e.g. http://localhost).
include:
  - ../laptopshop-api/docker-compose.yml

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *logging
    build:
      context: .
      args:
        API_ORIGIN: http://app:8080
    environment:
      API_ORIGIN: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    <<: *logging
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
